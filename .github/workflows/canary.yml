# Canary: consume the latest published Fallout -preview packages like a real user and
# fail loudly (open an issue) if any scenario build breaks.
name: canary

on:
  # Fired by Fallout's preview.yml after a -preview publish (see docs/DESIGN.md).
  repository_dispatch:
    types: [fallout-preview-published]
  # Safety net so the canary keeps running even before the dispatch link is wired.
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scenario:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one broken scenario must not mask the others
      matrix:
        # `kind` selects which steps below run. Most scenarios are `build` — restore the
        # floated -preview and run the consumer build. The others assert something a single
        # build can't express, so they get their own steps rather than a second job: gating
        # keeps the issue open/close reporting shared across every scenario.
        include:
          - { scenario: minimal,          kind: build }
          - { scenario: transition-shims, kind: build }
          - { scenario: tool-manifest,    kind: tool }
    steps:
      - uses: actions/checkout@v6

      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 'Restore + record resolved -preview version'
        id: ver
        if: matrix.kind == 'build'
        env:
          FALLOUT_PACKAGES_TOKEN: ${{ secrets.FALLOUT_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          proj="scenarios/${{ matrix.scenario }}/build/_build.csproj"
          dotnet restore "$proj"
          ver=$(dotnet list "$proj" package 2>/dev/null \
            | grep -iE 'Fallout\.Common|Nuke\.Common' | head -1 | awk '{print $NF}' || true)
          echo "version=${ver:-unknown}" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: ${ver:-unknown}"

      - name: 'Run scenario build'
        id: run
        if: matrix.kind == 'build'
        # Run from the scenario root so Fallout's root-marker walk finds its .fallout/ dir.
        working-directory: scenarios/${{ matrix.scenario }}
        env:
          FALLOUT_PACKAGES_TOKEN: ${{ secrets.FALLOUT_PACKAGES_TOKEN }}
        run: dotnet run --project build/_build.csproj --no-restore


      # The tool-manifest scenario exercises package *identity* rather than package contents. It
      # tests a transition, not a snapshot: a manifest pinned where a real consumer is pinned,
      # upgraded to the newest published tool. A floated pin could never have caught the rename
      # that stranded them. See scenarios/tool-manifest/README.md and Fallout-build/Fallout#575.
      - name: 'Tool manifest: restore the baseline pin, then upgrade to the current line'
        id: toolver
        if: matrix.kind == 'tool'
        working-directory: scenarios/tool-manifest
        run: |
          set -euo pipefail
          id=$(jq -r '.tools | keys[0]' .config/dotnet-tools.json)
          from=$(jq -r --arg id "$id" '.tools[$id].version' .config/dotnet-tools.json)
          echo "Manifest starts pinned at $id $from"

          # Step 1: the pin a consumer is sitting on has to still resolve. If nuget.org ever
          # unlists it out from under them, their `dotnet tool restore` breaks with no warning.
          dotnet tool restore

          # Step 2: the upgrade hop. `--prerelease` takes the newest published version of THIS
          # package id. It cannot cross to a different id, which is exactly why the rename in
          # Fallout-build/Fallout#575 stranded consumers: their manifest could not reach the new
          # version at all. If the shipping id is ever renamed again, this step fails.
          dotnet tool update "$id" --prerelease
          to=$(jq -r --arg id "$id" '.tools[$id].version' .config/dotnet-tools.json)
          echo "version=$to" >> "$GITHUB_OUTPUT"
          echo "Upgraded $id: $from -> $to"

          # A no-op upgrade means the manifest never moved — either the baseline is already the
          # newest, or the hop silently did nothing. Both need a human to look.
          if [ "$from" = "$to" ]; then
            echo "::error::$id did not move off the baseline pin $from — the upgrade hop resolved nothing."
            exit 1
          fi

          # Resolution is not enough on its own: assert the command is actually wired up.
          dotnet tool restore
          dotnet tool list --local | grep -q "^${id}"
          echo "$id is present in the local tool list"

      # Informational only. Deprecating the retired ids is a manual publishing action tracked
      # in Fallout-build/Fallout#575, so it must not fail the scenario and open a canary issue —
      # that would conflate "the tool is broken" with "we still owe a deprecation".
      - name: 'Tool manifest: report whether retired tool ids are signposted'
        if: matrix.kind == 'tool'
        continue-on-error: true
        run: |
          set -uo pipefail
          # The retired ids. fallout.globaltool (singular) is NOT here — it is the id the CLI
          # ships under; the plural was the short-lived rename that got reverted.
          for id in fallout.globaltools fallout.cli; do
            url="https://api.nuget.org/v3/registration5-gz-semver2/$id/index.json"
            # Recursive descent, not a fixed path: `//empty` on a fixed path emits nothing at
            # all for a NOT-deprecated package, which the old form then reported as "unknown".
            state=$(curl -sS --compressed "$url" \
              | jq -r '[.. | .deprecation? // empty] | if length > 0 then "yes" else "no" end' \
              || echo unknown)
            echo "retired id $id deprecated on nuget.org: ${state:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: 'On failure: open or update the canary issue'
        if: failure()
        uses: actions/github-script@v7
        env:
          SCENARIO: ${{ matrix.scenario }}
          VERSION: ${{ steps.ver.outputs.version || steps.toolver.outputs.version }}
        with:
          script: |
            const scenario = process.env.SCENARIO;
            const version = process.env.VERSION || 'unknown';
            const label = 'canary-failure';
            const title = `Canary failure: ${scenario}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Ensure the label exists (first run won't have it yet).
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                ...context.repo, name: label, color: 'b60205',
                description: 'A canary scenario build failed against the latest -preview',
              });
            }

            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: label, per_page: 100,
            });
            const match = open.find(i => i.title === title);
            // Open once and stay quiet while it remains open — a scheduled run shouldn't
            // post a "still failing" comment every night on a known/triaged failure. The
            // recovery path comments + closes, so transitions are still visible.
            if (match) {
              console.log(`Issue #${match.number} already open for "${scenario}" — no comment.`);
              return;
            }
            const body =
              `Scenario **\`${scenario}\`** failed against the latest \`-preview\`.\n\n` +
              `- Resolved package version: \`${version}\`\n` +
              `- Failed run: ${runUrl}\n` +
              `- When: ${new Date().toISOString()}`;
            await github.rest.issues.create({ ...context.repo, title, labels: [label], body });

      - name: 'On success: close the canary issue if open'
        if: success()
        uses: actions/github-script@v7
        env:
          SCENARIO: ${{ matrix.scenario }}
        with:
          script: |
            const scenario = process.env.SCENARIO;
            const label = 'canary-failure';
            const title = `Canary failure: ${scenario}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: label, per_page: 100,
            }).catch(() => []);
            const match = open.find(i => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: match.number,
                body: `✅ Scenario **\`${scenario}\`** is green again — closing.\n\nRun: ${runUrl}`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number: match.number, state: 'closed' });
            }
